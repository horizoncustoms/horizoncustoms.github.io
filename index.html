            --bg-color: #0d1117;
            --card-bg: #121212;
            --border-color: #222222;
            --accent-orange: #ff8800;
            --text-main: #c9d1d9;
            --text-muted: #888888;
            --sidebar-width: 260px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        .top-bar {
            width: 100%;
            height: 6px;
            background-color: var(--accent-orange);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .app-layout {
            display: flex;
            flex: 1;
            margin-top: 6px;
        }

        sidebar {
            width: var(--sidebar-width);
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            position: fixed;
            height: calc(100vh - 6px);
            box-sizing: border-box;
        }

        .sidebar-brand {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-brand span {
            color: var(--accent-orange);
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        .sidebar-menu a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            color: #ffffff;
            background-color: rgba(255, 136, 0, 0.1);
            border-left: 3px solid var(--accent-orange);
        }

        .sidebar-footer {
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px;
            box-sizing: border-box;
        }
