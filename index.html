<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Customs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Orange top bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: #ff8800;
        }
        /* Blackish-gray main rectangle */
        .main-card {
            background-color: #121212;
            border: 1px solid #222222;
            width: 90%;
            max-width: 500px;
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            letter-spacing: 1px;
        }
        p {
            color: #888888;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .links a {
            color: #ff8800;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="top-bar"></div>

    <div class="main-card">
        <h1>Horizon Customs</h1>
        <p>The official hub for services, tools, and documentation.</p>
        
        <div class="links">
            <a href="/tos">Terms of Service</a>
            <a href="/privacypolicy">Privacy Policy</a>
        </div>
    </div>
</body>
</html>
